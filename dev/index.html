<!doctype html>
<!--
  Dev page for SDCP Printer Card — no Home Assistant needed.
    python -m http.server 8765        (run in the repository root)
    http://127.0.0.1:8765/dev/?s=printing,paused,ready&theme=dark&lang=en
  Query: s= scenarios (printing, paused, idle, ready, offline, error, fdm, mars) · theme=dark|light
         lang=en|fr|de|es|uk|ru · printer=<drawing id> · profile=<printer_profile reported by the integration>
         drawing=<url of a drawing module to try, e.g. ../examples/sdcp-printer-example.js> · open=files|camera
-->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDCP Printer Card — dev</title>
<style>
 body{margin:0;padding:24px;font-family:Roboto,"Noto Sans",system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
 body.dark{background:#111;--primary-text-color:#e6e6e6;--secondary-text-color:#9e9e9e;--divider-color:#3a3a3a;--card-background-color:#1c1c1c}
 body.light{background:#f0f0f0;--primary-text-color:#1c1c1c;--secondary-text-color:#727272;--divider-color:#e0e0e0;--card-background-color:#fff}
 .slot{width:440px;max-width:100%}
</style>
<script type="module">
  // stand-ins for HA's <ha-card> and <ha-icon> (icons from @mdi/js)
  let mdi = {};
  try { mdi = await import("https://cdn.jsdelivr.net/npm/@mdi/js@7.4.47/mdi.js"); }
  catch (e) { console.warn("icons unavailable (offline?)", e); }
  const path = (name) => mdi["mdi" + name.replace(/^mdi:/, "").split("-").map((w) => w[0].toUpperCase() + w.slice(1)).join("")] || "";
  customElements.define("ha-card", class extends HTMLElement { connectedCallback() {
    Object.assign(this.style, { display: "block", background: "var(--card-background-color)", borderRadius: "12px", boxShadow: "0 2px 6px rgba(0,0,0,.25)" }); } });
  customElements.define("ha-icon", class extends HTMLElement {
    static get observedAttributes() { return ["icon"]; }
    attributeChangedCallback() { this.r(); } connectedCallback() { this.r(); }
    r() { const s = (getComputedStyle(this).getPropertyValue("--mdc-icon-size") || "24px").trim() || "24px";
      this.style.display = "inline-flex";
      this.innerHTML = `<svg viewBox="0 0 24 24" width="${s}" height="${s}" style="fill:currentColor"><path d="${path(this.getAttribute("icon") || "")}"/></svg>`; } });
  await import("../dist/sdcp-printer-card.js?v=dev");
  await import("./scenarios.js");
</script>
</head><body></body></html>
